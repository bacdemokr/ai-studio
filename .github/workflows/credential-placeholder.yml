name: Empty credential placeholder
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure api.cfg contains no credential
        run: |
          if [ ! -f api.cfg ] || [ -s api.cfg ]; then
            echo 'api.cfg must be an empty placeholder. Configure the local Git clean filter before saving a key.'
            exit 1
          fi
